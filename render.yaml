# render.yaml
# A Render "Blueprint": it tells Render how to build and run the backend, and to
# create a free PostgreSQL database and connect it automatically.
#
# To use it: on render.com choose "New +" -> "Blueprint" and pick this repo.

services:
  - type: web
    name: deepfake-challenge-api
    runtime: python
    rootDir: backend          # the backend lives in the backend/ folder
    plan: free
    buildCommand: pip install -r requirements.txt
    # On each start: create tables + demo data, then run the production server.
    startCommand: python seed.py && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true   # Render generates a long random secret for us
      - key: DATABASE_URL
        fromDatabase:
          name: deepfake-challenge-db
          property: connectionString

databases:
  - name: deepfake-challenge-db
    plan: free
